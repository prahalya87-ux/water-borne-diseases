<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>WaterGuard AI</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{colors:{navy:{900:'#0a1f3d',800:'#0f2d57',700:'#173c70'},teal:{DEFAULT:'#0d9488',700:'#0f766e'}},fontFamily:{sans:['"IBM Plex Sans"','system-ui','sans-serif'],display:['Fraunces','Georgia','serif']}}}}</script>
<style>
body{font-family:'IBM Plex Sans',system-ui,sans-serif;margin:0;color:#1e293b}
.dark{color:#f1f5f9}
.card{border-radius:12px;border:1px solid #e2e8f0;background:#fff;padding:1rem;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.dark .card{border-color:#1e293b;background:#0f172a}
.btn{display:inline-flex;align-items:center;gap:.5rem;border-radius:8px;background:#0d9488;color:#fff;padding:.5rem 1rem;font-size:.875rem;font-weight:500;border:1px solid transparent;cursor:pointer}
.btn:hover{background:#0f766e}.btn:disabled{opacity:.5}
.btn:focus-visible{outline:2px solid #06b6d4;outline-offset:2px}
.btn-ghost{background:transparent;color:#334155;border-color:#cbd5e1}
.btn-ghost:hover{background:#f1f5f9}
.dark .btn-ghost{color:#e2e8f0;border-color:#334155}.dark .btn-ghost:hover{background:#1e293b}
.input{width:100%;box-sizing:border-box;border-radius:8px;border:1px solid #cbd5e1;background:#fff;padding:.5rem .75rem;font-size:.875rem;color:inherit}
.dark .input{border-color:#334155;background:#0f172a}
</style></head><body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
