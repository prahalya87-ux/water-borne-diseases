services:
  - type: web
    name: waterguard-api-prahalya87-ux
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: waterguard-db-prahalya87-ux
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://waterguard-web-prahalya87-ux.onrender.com
      - key: AUTO_CREATE_TABLES
        value: "true"

  - type: web
    name: waterguard-web-prahalya87-ux
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://waterguard-api-prahalya87-ux.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: waterguard-db-prahalya87-ux
    databaseName: waterguard
    user: waterguard
    plan: free
    region: singapore
